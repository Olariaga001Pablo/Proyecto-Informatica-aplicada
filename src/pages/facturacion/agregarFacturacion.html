<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Factura</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="clientes-container">
    <header class="clientes-header">
      <button id="home" class="btn-volver">←</button>
      <h1>Nueva Factura</h1>
    </header>

    <main>
      <form id="form-agregar-factura" class="form-cliente">
        <div id="mensaje-error" class="error-notification"></div>

        <label for="proyecto-factura">Proyecto</label>
        <select id="proyecto-factura" class="select-proveedor" required>
          <option value="">Seleccione un Proyecto</option>
        </select>

        <label for="cliente-factura">Cliente</label>
        <input type="text" id="cliente-factura" readonly placeholder="Se completa al elegir un proyecto">

        <label for="costo-factura">Costo del proyecto</label>
        <input type="text" id="costo-factura" readonly placeholder="Se completa al elegir un proyecto">

        <label for="fecha-factura">Fecha</label>
        <input type="date" id="fecha-factura" required>

        <div class="form-botones">
          <button type="button" class="btn-cancelar" id="btn-cancelar">Cancelar</button>
          <button type="submit" class="btn-guardar">Guardar Factura</button>
        </div>
      </form>
    </main>
  </div>

  <script src="./script.js"></script>
</body>
</html>
