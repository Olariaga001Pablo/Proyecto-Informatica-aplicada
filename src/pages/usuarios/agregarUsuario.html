<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Usuario</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="usuarios-container">

  <header class="usuarios-header">
    <button id="home" class="btn-volver">←</button>
    <h1>Agregar Usuario</h1>
  </header>

  <div id="error-msg" class="error-notification"></div>

  <form id="form-agregar-usuario" class="form-usuario">

    <label for="email">Email</label>
    <input type="email" id="email" required>

    <label for="password">Contraseña</label>
    <input type="password" id="password" required minlength="6">

    <label for="rol">Rol</label>
    <select id="rol" required>
      <option value="" selected disabled>Seleccioná un rol</option>
      <option value="administrador">Administrador</option>
      <option value="empleado">Empleado</option>
    </select>

    <!-- Datos del empleado -->
    <div id="datos-empleado">

      <div class="campo">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre">
      </div>

      <div class="campo">
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido">
      </div>

      <div class="campo">
        <label for="direccion">Dirección</label>
        <input type="text" id="direccion">
      </div>

      <div class="campo">
        <label for="codigo_postal">Código Postal</label>
        <input type="text" id="codigo_postal">
      </div>

      <div class="campo campo-completo">
        <label>Especialidades</label>

        <div id="especialidades-checkboxes" class="checkbox-lista">
          <!-- El script carga los checkboxes -->
        </div>  

      </div>

    </div>

    <div class="form-botones">
      <button type="button" id="btn-cancelar" class="btn-cancelar">
        Cancelar
      </button>

      <button type="submit" class="btn-guardar">
        Guardar
      </button>
    </div>

  </form>

</div>

<script src="./script.js"></script>

</body>
</html>
