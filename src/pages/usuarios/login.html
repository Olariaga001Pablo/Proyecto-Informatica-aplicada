<!-- src/pages/usuarios/login.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar sesión - Sistema de Paneles Solares</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="login-header">
    <h1>Bienvenido</h1>
  </header>

  <div class="login-container">
    <div id="error-msg" class="error-notification"></div>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Value" required autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Value" required>

      <button type="submit" class="btn-ingresar">Ingresar</button>
    </form>
  </div>

  <script src="./login.js"></script>
</body>
</html>
