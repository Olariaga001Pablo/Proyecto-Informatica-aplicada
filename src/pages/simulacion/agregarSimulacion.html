<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Simulación</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="clientes-container">
    <header class="clientes-header">
      <button id="home" class="btn-volver">←</button>
    </header>

    <main>
      <form id="form-agregar-simulacion" class="form-cliente">
        <div id="mensaje-error" class="error-notification"></div>

        <h2>Simulación &gt; Nueva</h2>

        <label for="proyecto-simulacion">Proyecto</label>
        <select id="proyecto-simulacion" class="select-proveedor" required>
          <option value="">Seleccione un Proyecto</option>
        </select>

        <label for="cantidad-paneles">Cantidad de paneles (según el proyecto)</label>
        <input type="number" id="cantidad-paneles" min="1" step="1" readonly required>

        <label for="potencia-panel">Potencia por panel promedio (W) (según el proyecto)</label>
        <input type="number" id="potencia-panel" min="1" step="0.01" readonly required>

        <label for="horas-sol">Horas de sol por día</label>
        <input type="number" id="horas-sol" min="0" max="24" step="0.1" required>

        <label for="consumo-previo">Consumo previo (kWh/mes)</label>
        <input type="number" id="consumo-previo" min="0" step="0.01" required>

        <label for="tarifa-kwh">Tarifa por kWh ($)</label>
        <input type="number" id="tarifa-kwh" min="0" step="0.01" required>

        <div class="form-botones">
          <button type="button" class="btn-cancelar" id="btn-cancelar">Cancelar</button>
          <button type="submit" class="btn-guardar">Calcular y Guardar</button>
        </div>
      </form>
    </main>
  </div>

  <script src="./script.js"></script>
</body>
</html>
